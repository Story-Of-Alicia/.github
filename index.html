<html lang="en-US">
<head>
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
  <title>Story of Alicia</title>
  
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<style>

@font-face {
  font-family: Eurostile;
  src: url('assets/eurostile.otf');
}

@font-face {
  font-family: Quincho;
  src: url('assets/quincho.ttf');
}

html, body {
  height: 100%;
}

body {
  padding: 0;
  margin: 0;
  width: 100%;
  min-height: 100vh;
  box-sizing: border-box;

  background-image: url('assets/bg.png');
  background-color: #DFE4EA;
  background-size: auto 100vh;
  background-position-x: right;
  background-position-y: top;
  background-repeat: no-repeat;
  background-attachment: fixed;

  display: flex;
  flex-direction: column;
  justify-content: safe center;
}


#content {
  display: flex;
  width: 50%;
  padding: 2rem 5rem;
  box-sizing: border-box;
}

#header
{
  display: flex;
  flex-direction: column;
}

#header p
{
  font-family: Eurostile;
}

#header div
{
  display: flex;
  justify-content: center;
}

#title p {
  color: #2C2B2B;
  font-size: clamp(2.5rem, 8vw, 7rem);
  line-height: 1;
  padding: 0;
  margin: 0;

  text-align: center;
}

#title .script
{
  font-size: clamp(3rem, 10vw, 8.75rem);
  font-family: Quincho;
}

#description p {
  margin: 0;
  color: #6D84BD;
  max-width: 70%;
  text-align: center;
  font-size: clamp(1rem, 2vw, 2rem);

  text-transform: uppercase;
}

#socials {
  padding: clamp(0.5rem, 2vw, 2rem);
}

#socials img
{
  width: clamp(2rem, 4vw, 4rem);
  color: #B4C9DE;
  padding: 0.5rem;
}

#socials img:hover
{
  color: #6D84BD;
  transition: background-color 0.3s ease, color 0.3s ease;
}

#actions {
  width: 100%;
  display: flex;
  justify-content: center;
}

.button {
  display: inline-block;
  background: #B4C9DE;
  color: #6D84BD;
  border-radius: 5px;
  font-family: Eurostile;
  font-size: 24px;
  text-transform: uppercase;
  font-weight: bold;
  border: none;
  padding: 0.75rem 4rem;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
}

@media (max-width: 850px) {
  #content {
    width: 100%;
    padding: 0;
  }
  body{
    background-position: center;
  }
}

</style>
<body>
  <div id="content">
    <div id="header">
      <div id="title">
        <p>STORY OF <span class="script">Alicia</span></p>
      </div>
      <div id="description">
        <p>Story of Alicia is a fan-made private server and preservation project for Ntreev Soft's Alicia.</p>
      </div>
      <div id="socials">
        <a href="https://discord.gg/storyofalicia" target="_blank">
          <img src="assets/discord-brands-solid-full.svg" alt="">
        </a>
        <a href="https://vk.com/story_of_alicia" target="_blank">
          <img src="assets/vk-brands-solid-full.svg" alt="">
        </a>
        <a href="https://github.com/Story-Of-Alicia" target="_blank">
          <img src="assets/github-brands-solid-full.svg" alt="">
        </a>
        <a href="https://wiki.storyofalicia.com" target="_blank">
          <img src="assets/book-solid-full.svg" alt="">
        </a>
      </div>
      <div id="description">
        <p style="margin-bottom: 1.5rem;">Participate in the public play test</p>
      </div>
      <div id="actions">
          <a class="button" href="https://r2.storyofalicia.com/launcher/Story%20of%20Alicia%20Launcher_1.0.6_x64-setup.exe">Download the launcher</a>
      </div>
    </div>
  </div>
</body>
</html>
