<script>

let user = null;
let token = null;
let userName = null;

//! Retrieves and scrapes credentials from the URL parameters and stores them in the local storage.
function scrapeCredentials()
{
  const params = new URLSearchParams(document.location.search);
  const hasCredentials = params.has("user") && params.has("token") && params.has("username");

  if (!hasCredentials)
      return;

  user = params.get("user");
  token = params.get("token");
  userName = params.get("username");
  
  const url = new URL(document.location);
  url.search = "";
  window.history.replaceState({}, document.title, url.toString());

  console.log("Credentials retrieved and scrapped from the URL.");
}

function handoffCredentials()
{
  console.log("Redirecting to the launcher with the retrieved credentials...");
  const uri = `soa://launcher/?user=${encodeURIComponent(user)}&token=${encodeURIComponent(token)}&username=${encodeURIComponent(userName)}`;
  window.location.href = uri;
}

function main()
{
  scrapeCredentials();
  handoffCredentials();

  console.log("Your credentials are stored in `user` and `token` variables.");
  console.log("You can launch the game manually by running the game client with the following command line arguments:");
  console.log("\t./Alicia.exe -GameID 4 -ID [{user}] -OP [{token}]");
  console.log("Replace `{user}` and `{token}` with the actual values of the `user` and `token` variables but keep the square brackets.");
  console.log("You can read more about the game at https://wiki.storyofalicia.com/");
}

</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launcher credentials handoff</title>
</head>
<body onload="main()">
    Credentials handed off to the launcher, you can close this page. If you need to get your credentials manually then open the console. 
</body>
</html>
